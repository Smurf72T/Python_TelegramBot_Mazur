# =============================================================================
# Docker Compose конфигурация для приложения заметок
# =============================================================================
# Этот файл определяет оркестрацию всех сервисов приложения:
# - PostgreSQL: база данных для хранения всех данных приложения
# - Django: веб-панель администратора с REST API
# - Bot: Telegram-бот для взаимодействия с пользователями
# - Tests: сервис для запуска тестов
#
# Для запуска всех сервисов: docker-compose up -d
# Для остановки всех сервисов: docker-compose down
# =============================================================================

services:
  # =============================================================================
  # Сервис базы данных PostgreSQL
  # =============================================================================
  db:
    # Используем официальный образ PostgreSQL версии 16
    image: postgres:16
    
    # Уникальное имя контейнера для удобства управления
    container_name: calendar_db
    
    # Имя хоста внутри Docker-сети (используется другими сервисами)
    hostname: db
    
    # Автоматический перезапуск контейнера при сбое
    restart: always
    
    # Загружаем переменные окружения из файла .env
    env_file:
      - .env
    
    # Переменные окружения для конфигурации PostgreSQL
    environment:
      # Имя базы данных (берется из .env)
      - POSTGRES_DB=${DB_NAME}
      # Имя пользователя PostgreSQL (берется из .env)
      - POSTGRES_USER=${POSTGRES_USER}
      # Пароль пользователя PostgreSQL (обязательный параметр)
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    
    # Подключение volumes (томов) для хранения данных
    volumes:
      # postgres_data: именованный том для персистентного хранения данных БД
      - postgres_data:/var/lib/postgresql/data
    
    # Проброс портов для доступа к БД с хостовой машины
    ports:
      - "5432:5432"  # формат: порт_хоста:порт_контейнера
    
    # Health check: проверка готовности сервиса
    healthcheck:
      # Команда проверки: pg_isready проверяет готовность PostgreSQL к подключениям
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      # Интервал выполнения проверки (5 секунд)
      interval: 5s
      # Тайм-аут выполнения проверки (5 секунд)
      timeout: 5s
      # Количество неудачных попыток перед пометкой сервиса как unhealthy (5)
      retries: 5

  # =============================================================================
  # Сервис Django Admin Panel
  # =============================================================================
  django:
    # Настройки сборки образа
    build:
      # Контекст сборки: директория с Dockerfile.django
      context: ./django-admin-panel
      # Имя используемого Dockerfile
      dockerfile: Dockerfile.django
    
    # Уникальное имя контейнера
    container_name: calendar_django
    
    # Автоматический перезапуск при сбое
    restart: always
    
    # Зависимости от других сервисов
    depends_on:
      # Ждем полной готовности сервиса db
      db:
        condition: service_healthy
    
    # Загружаем переменные окружения из .env
    env_file:
      - .env
    
    # Дополнительные переменные окружения
    environment:
      # Указываем, что работаем в Docker-окружении
      - RUN_ENV=docker
      # Хост БД при запуске в Docker (имя сервиса db)
      - DB_HOST_DOCKER=db
      # Хост БД при локальном запуске (для совместимости)
      - DB_HOST_LOCAL=localhost
    
    # Проброс портов для доступа к веб-интерфейсу
    ports:
      - "8000:8000"  # Django доступен на http://localhost:8000
    
    # Health check для проверки доступности Django (временно отключён из-за проблем с экранированием в Windows)
    # healthcheck:
    #   test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/')\""]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s
    
    # Подключение volumes для разработки (hot reload)
    volumes:
      # Монтируем директорию с кодом для отслеживания изменений
      - ./django-admin-panel:/app
    
    # Команда запуска (переопределяет CMD из Dockerfile)
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # =============================================================================
  # Сервис Telegram-бота
  # =============================================================================
  bot:
    # Настройки сборки образа
    build:
      # Контекст сборки: корневая директория проекта
      context: .
      # Имя используемого Dockerfile
      dockerfile: Dockerfile.bot
    
    # Уникальное имя контейнера
    container_name: calendar_bot
    
    # Автоматический перезапуск при сбое
    restart: always
    
    # Зависимости от других сервисов
    depends_on:
      # Ждем полной готовности сервиса db
      db:
        condition: service_healthy
    
    # Загружаем переменные окружения из .env
    env_file:
      - .env
    
    # Дополнительные переменные окружения для Docker
    environment:
      - RUN_ENV=docker
      - DB_HOST_DOCKER=db
      - DB_HOST_LOCAL=localhost
      - ANYIO_BACKEND=asyncio
    
    # Подключение volumes для разработки (hot reload)
    volumes:
      # Монтируем всю директорию проекта
      - .:/app

  # =============================================================================
  # Сервис для запуска тестов
  # =============================================================================
  tests:
    # Используем тот же Dockerfile, что и для бота
    build:
      context: .
      dockerfile: Dockerfile.bot
    
    # Команда запуска тестов
    command: >
      sh -c "cd django-admin-panel && python -m pytest tests/ -v --ds=admin_panel.settings"
    
    # Загружаем переменные окружения из .env
    env_file:
      - .env
    
    # Дополнительные переменные окружения для Docker
    environment:
      - RUN_ENV=docker
      - DB_HOST_DOCKER=db
      - DB_HOST_LOCAL=localhost
    
    # Зависимости от других сервисов
    depends_on:
      # Ждем полной готовности сервиса db
      db:
        condition: service_healthy

# =============================================================================
# Определение volumes (томов)
# =============================================================================
# Volumes используются для персистентного хранения данных вне контейнеров
# Это позволяет сохранять данные при перезапуске или пересоздании контейнеров
volumes:
  # Именованный том для данных PostgreSQL
  postgres_data: